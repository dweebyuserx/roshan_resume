<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://www.clarity.ms https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.clarity.ms; connect-src 'self' https://cloudflareinsights.com https://www.clarity.ms; base-uri 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>~/user — about</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100;0,300;0,400;0,600;0,700;1,300&family=Oxanium:wght@400;600;700;800&family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #0a0b0d;
    --bg2: #0f1117;
    --bg3: #141720;
    --border: #1e2230;
    --dim: #3a4055;
    --muted: #5a6380;
    --text: #c8cfe8;
    --bright: #e8eeff;
    --cyan: #4dd9f0;
    --green: #3dffa0;
    --orange: #ff9f4a;
    --purple: #a78bfa;
    --pink: #f472b6;
    --yellow: #fbbf24;
    --red: #f87171;
    --font-mono: 'JetBrains Mono', monospace;
    --font-display: 'Oxanium', sans-serif;
    --font-label: 'Share Tech Mono', monospace;
    --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 48px; --s6: 64px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.8;
    overflow-x: hidden;
    cursor: none;
  }

  .cursor {
    width: 6px; height: 6px;
    background: var(--cyan);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px var(--cyan);
  }
  .cursor-ring {
    width: 28px; height: 28px;
    border: 1px solid rgba(77,217,240,0.4);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: all 0.15s ease;
  }

  /* ── EFFECT LAYERS ── */
  #rain-cv { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 1; pointer-events: none; }
  #illus-cv { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; }
  #illus-cv.show { opacity: 1; }
  #dot-field { position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background-image: radial-gradient(circle, var(--dim) 1px, transparent 1px);
    background-size: 28px 28px; }
  #cur-glow { position: fixed; z-index: 3; pointer-events: none; border-radius: 50%;
    width: 0; height: 0;
    background: radial-gradient(circle, rgba(77,217,240,0.06) 0%, transparent 65%);
    transform: translate(-50%, -50%);
    transition: left 0.06s linear, top 0.06s linear, width 0.4s ease, height 0.4s ease; }
  #vign { position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%); }
  #illus-label { position: fixed; z-index: 50; font-family: var(--font-label); font-size: 9px;
    letter-spacing: 1.5px; color: var(--cyan); background: rgba(6,7,9,0.85);
    border: 1px solid rgba(77,217,240,0.25); border-radius: 3px; padding: 4px 10px;
    pointer-events: none; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
  #illus-label.show { opacity: 1; }

  /* ── UPDATED CURSOR ── */
  .cursor { box-shadow: 0 0 10px var(--cyan); }
  .cursor-ring { transition: width 0.15s, height 0.15s, border-color 0.15s; }

  /* ── PARTICLE TRAIL ── */
  .particle-trail { position: fixed; pointer-events: none; z-index: 9997; border-radius: 50%;
    width: 3px; height: 3px; animation: pt-fade 0.7s ease-out forwards; }
  @keyframes pt-fade { to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); } }

  /* ── COMPILE-REVEAL ── */
  .compile-card { position: relative; overflow: hidden; }
  .compile-overlay {
    position: absolute; inset: 0; padding: 14px 16px;
    font-size: 9px; line-height: 1.5; color: var(--dim);
    white-space: pre; pointer-events: none;
    background: inherit; z-index: 1;
    opacity: 1; transition: opacity 0.25s ease;
  }
  .compile-card.visible .compile-overlay { opacity: 0; transition-delay: 0.2s; }
  .compile-real { opacity: 0; transition: opacity 0.3s ease 0.35s; }
  .compile-card.visible .compile-real { opacity: 1; }
  .compile-card::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.5s ease 0.15s; z-index: 2;
  }
  .compile-card.visible::after { transform: scaleX(1); }

  /* ── MOBILE: disable effects ── */
  @media (max-width: 768px) {
    #rain-cv, #illus-cv, #dot-field, #cur-glow, #vign, #illus-label { display: none; }
    .cursor, .cursor-ring { display: none; }
    body { cursor: auto; }
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.09) 3px, rgba(0,0,0,0.09) 4px);
    pointer-events: none;
    z-index: 4;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 40px;
    background: rgba(10,11,13,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--cyan);
    letter-spacing: 0.05em;
    text-decoration: none;
  }
  .nav-logo span { color: var(--muted); }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }
  .nav-links a {
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.2s;
    cursor: none;
  }
  .nav-links a::before {
    content: '> ';
    color: var(--green);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .nav-links a:hover { color: var(--bright); }
  .nav-links a:hover::before { opacity: 1; }
  .nav-links a.active { color: var(--cyan); }

  .nav-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .status-dot {
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  main {
    padding: 120px 60px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .page-header {
    margin-bottom: 60px;
    animation: phIn 0.6s ease 0.05s both;
  }
  @keyframes phIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .page-header h1 {
    font-family: var(--font-display);
    font-size: clamp(36px, 5vw, 56px);
    font-weight: 800;
    color: var(--bright);
    margin-bottom: 16px;
  }
  .page-header h1 em {
    font-style: normal;
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .page-header .breadcrumb {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 24px;
  }
  .page-header .breadcrumb a {
    color: var(--cyan);
    text-decoration: none;
  }

  .section-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .section-label::before { content: attr(data-n); color: var(--cyan); }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
    max-width: 200px;
  }

  .about-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
  }

  .bio-section p {
    font-size: 14px;
    line-height: 2;
    color: var(--text);
    margin-bottom: 24px;
  }
  .bio-section p strong { color: var(--cyan); font-weight: 400; }

  .experience-section {
    margin-top: 60px;
  }

  .experience-item {
    padding: 24px 0;
    border-bottom: 1px solid var(--border);
  }
  .experience-item:first-child {
    border-top: 1px solid var(--border);
  }

  .exp-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .exp-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 700;
    color: var(--bright);
  }

  .exp-company {
    font-size: 13px;
    color: var(--cyan);
    margin-top: 4px;
  }

  .exp-date {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .exp-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.8;
  }

  .exp-tag {
    font-size: 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .exp-tag.current  { background: rgba(61,255,160,0.12);  color: var(--green);  border: 1px solid rgba(61,255,160,0.3); }
  .exp-tag.promoted { background: rgba(77,217,240,0.1);   color: var(--cyan);   border: 1px solid rgba(77,217,240,0.3); }
  .exp-tag.concurrent{ background: rgba(167,139,250,0.1); color: var(--purple); border: 1px solid rgba(167,139,250,0.3); }
  .exp-tag.foundation{ background: rgba(255,159,74,0.1);  color: var(--orange); border: 1px solid rgba(255,159,74,0.3); }
  .exp-progression {
    font-size: 10px;
    color: var(--dim);
    margin-top: 4px;
    letter-spacing: 0.05em;
  }

  .skills-section {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 32px;
  }

  .skill-group {
    margin-bottom: 32px;
  }
  .skill-group:last-child { margin-bottom: 0; }

  .skill-group-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .skill-bars { display: grid; gap: 12px; }

  .skill-row {
    display: grid;
    grid-template-columns: 140px 1fr 30px;
    align-items: center;
    gap: 16px;
  }
  .skill-name { font-size: 11px; color: var(--text); }
  .skill-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .skill-fill {
    height: 100%;
    border-radius: 2px;
    transform-origin: left;
    transform: scaleX(0);
    transition: transform 1s cubic-bezier(0.4,0,0.2,1);
  }
  .skill-fill.cyan { background: linear-gradient(90deg, var(--cyan), var(--purple)); }
  .skill-fill.green { background: linear-gradient(90deg, var(--green), var(--cyan)); }
  .skill-fill.orange { background: linear-gradient(90deg, var(--orange), var(--pink)); }
  .skill-pct { font-size: 10px; color: var(--muted); text-align: right; }

  .education-section {
    margin-top: 48px;
    padding: 24px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .edu-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .edu-degree {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    color: var(--bright);
  }

  .edu-school {
    font-size: 12px;
    color: var(--cyan);
    margin-top: 4px;
  }

  .edu-year {
    font-size: 11px;
    color: var(--muted);
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 32px 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
  }

  .fade-up {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .fade-up.visible {
    opacity: 1;
    transform: none;
  }

  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(61,255,160,0.4); } 50% { box-shadow: 0 0 0 5px rgba(61,255,160,0); } }

  /* ── SCROLL PROGRESS ── */
  #scroll-prog { position: fixed; top: 0; left: 0; right: 0; height: 2px; background: rgba(77,217,240,0.08); z-index: 10000; pointer-events: none; }
  #scroll-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--green)); transition: width 0.1s linear; }

  /* ── TERMINAL STATUS BAR ── */
  #term-bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 28px;
    background: rgba(10,11,13,0.92); border-top: 1px solid rgba(77,217,240,0.1);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    font-family: 'Share Tech Mono', monospace; font-size: 10px;
    color: rgba(200,207,232,0.35); letter-spacing: 0.08em;
    z-index: 200; pointer-events: none;
  }
  #term-path { color: rgba(77,217,240,0.5); }
  #term-right { color: rgba(61,255,160,0.4); }
  @media (max-width: 768px) { #term-bar, #scroll-prog { display: none; } }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 900px) {
    nav { padding: 16px 24px; }
    main { padding: 100px 24px 60px; }
    .about-content { grid-template-columns: 1fr; gap: 48px; }
    footer { flex-direction: column; gap: 12px; text-align: center; }
  }

  /* ─── TIMELINE ──────────────────────────────────────────── */
  .timeline-section { margin-top: 80px; width: 100%; }
  .tl-ruler {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    margin-bottom: 8px;
    padding: 0 2px;
  }
  .tl-ruler-year {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.05em;
    position: relative;
  }
  .tl-ruler-year::before {
    content: '';
    position: absolute;
    top: -6px; left: 0;
    width: 1px; height: 5px;
    background: var(--border);
  }
  .tl-tracks { position: relative; padding: 8px 0; }
  .tl-track { position: relative; height: 48px; margin-bottom: 6px; }
  .tl-bar {
    position: absolute;
    top: 6px; height: 32px;
    border-radius: 16px;
    display: flex; align-items: center;
    padding: 0 14px;
    overflow: hidden;
    cursor: default;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.8s cubic-bezier(0.4,0,0.2,1);
    white-space: nowrap;
  }
  .tl-bar.animate { transform: scaleX(1); }
  .tl-bar-label { font-size: 11px; font-weight: 600; color: var(--bright); letter-spacing: 0.05em; overflow: hidden; text-overflow: ellipsis; }
  .tl-bar-role { font-size: 10px; color: rgba(200,207,232,0.55); margin-left: 8px; overflow: hidden; text-overflow: ellipsis; }
  .tl-pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--bright); margin-left: 8px; flex-shrink: 0;
    animation: tlpulse 1.5s infinite;
  }
  @keyframes tlpulse {
    0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
    50% { opacity: 0.6; box-shadow: 0 0 0 5px rgba(255,255,255,0); }
  }
  .tl-tooltip {
    display: none;
    position: absolute;
    top: 46px; left: 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 11px; color: var(--text);
    z-index: 10; min-width: 260px; max-width: 380px;
    line-height: 1.7;
    pointer-events: none;
  }
  .tl-track:hover .tl-tooltip { display: block; }

  /* ─── CERTIFICATIONS ─────────────────────────────────────── */
  .cert-section { margin-top: 80px; width: 100%; }
  .cert-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .cert-card {
    background: var(--bg2);
    border: 1px solid var(--border); border-left-width: 3px;
    border-radius: 6px;
    padding: 18px 20px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .cert-top { display: flex; align-items: flex-start; gap: 12px; }
  .cert-badge {
    font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
    padding: 3px 7px; border-radius: 4px;
    background: var(--bg3); border: 1px solid var(--border);
    flex-shrink: 0; margin-top: 2px;
  }
  .cert-info { flex: 1; }
  .cert-name { font-size: 13px; font-weight: 600; color: var(--bright); line-height: 1.4; }
  .cert-meta { font-size: 11px; color: var(--cyan); margin-top: 3px; }
  .cert-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .cert-tag {
    font-size: 9px; letter-spacing: 0.08em;
    padding: 2px 7px; border-radius: 10px;
    background: var(--bg3); color: var(--muted); border: 1px solid var(--border);
  }
  .cert-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cert-courses-toggle {
    font-size: 10px; color: var(--muted); cursor: pointer;
    background: none; border: none; font-family: var(--font-mono); padding: 0;
    transition: color 0.2s;
  }
  .cert-courses-toggle:hover { color: var(--cyan); }
  .cert-courses-list { display: none; flex-direction: column; gap: 3px; padding: 4px 0 0 10px; font-size: 10px; color: var(--muted); list-style: none; }
  .cert-courses-list.open { display: flex; }
  .cert-courses-list li::before { content: '↳ '; color: var(--dim); }
  .cert-verify { font-size: 10px; color: var(--green); text-decoration: none; letter-spacing: 0.05em; white-space: nowrap; }
  .cert-verify:hover { text-decoration: underline; }

  /* ─── SKILL TREE ─────────────────────────────────────────── */
  .tree-section { margin-top: 80px; width: 100%; }
  .tree-container { width: 100%; max-width: 900px; margin: 0 auto; }
  #skillTreeSvg { width: 100%; height: auto; display: block; }
  .tree-line { stroke-linecap: round; fill: none; opacity: 0.35; transition: opacity 0.3s, stroke 0.3s; }
  .tree-line.hl { opacity: 1; }
  .tree-line.dim { opacity: 0.06; }
  .leaf-group { transition: opacity 0.3s; }
  .leaf-group.dim { opacity: 0.1; }
  .domain-group { cursor: pointer; }
  .domain-group.dim circle { opacity: 0.12; }
  .tree-fallback { display: none; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .tree-branch-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
  .tree-branch-title { font-size: 12px; font-weight: 600; color: var(--bright); margin-bottom: 10px; }
  .tree-leaf-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tree-leaf-pill { font-size: 9px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); background: var(--bg3); }

  @media (max-width: 900px) {
    .cert-grid { grid-template-columns: 1fr; }
    .tl-bar-role { display: none; }
    .timeline-section, .cert-section, .tree-section { margin-top: 60px; }
  }
  @media (max-width: 600px) {
    .tree-container { display: none; }
    .tree-fallback { display: grid; }
    .skill-row { grid-template-columns: auto 1fr auto; }
    .skill-name { font-size: 10px; }
  }

  /* ─── HOBBIES ─────────────────────────────────────────────── */
  .hobbies-section { margin-top: 80px; width: 100%; }
  .hobby-grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .hobby-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1 1 180px;
  }
  .hobby-icon { font-size: 28px; line-height: 1; }
  .hobby-label { font-size: 12px; font-weight: 600; color: var(--bright); }
  .hobby-desc { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 2px; }

  /* Touch: hide custom cursor */
  @media (hover: none) {
    body { cursor: auto; }
    .cursor, .cursor-ring { display: none; }
  }

  /* Nav overflow on small phones */
  @media (max-width: 520px) {
    .nav-links { gap: 16px; }
    .nav-links a { font-size: 10px; letter-spacing: 0.06em; }
    .nav-status { display: none; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/animejs@4/lib/anime.iife.min.js"></script>

// ── EFFECT LAYERS INIT ──
(function initEffects(ZONES) {
  if (window.innerWidth <= 768) return;

  const curEl   = document.getElementById('cursor');
  const ringEl  = document.getElementById('cursorRing');
  const glowEl  = document.getElementById('cur-glow');
  const ilCv    = document.getElementById('illus-cv');
  const ilCtx   = ilCv.getContext('2d');
  const ilLabel = document.getElementById('illus-label');
  const rainCv  = document.getElementById('rain-cv');
  const rCtx    = rainCv.getContext('2d');

  let mx = window.innerWidth / 2, my = window.innerHeight / 2;
  let rx = mx, ry = my;

  function resizeCv() {
    rainCv.width  = ilCv.width  = window.innerWidth;
    rainCv.height = ilCv.height = window.innerHeight;
  }
  resizeCv();
  window.addEventListener('resize', resizeCv);

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    if (curEl)  { curEl.style.left  = mx + 'px'; curEl.style.top  = my + 'px'; }
    if (glowEl) { glowEl.style.left = mx + 'px'; glowEl.style.top = my + 'px'; }
    ilLabel.style.left = (mx + 16) + 'px';
    ilLabel.style.top  = (my - 28) + 'px';
    if (Math.random() > 0.68) spawnParticle(mx, my);
    checkZones(mx, my);
  });

  function spawnParticle(x, y) {
    const p = document.createElement('div');
    p.className = 'particle-trail';
    const cols = ['#4dd9f0','#3dffa0','#a78bfa','#f472b6'];
    const c = cols[Math.floor(Math.random() * 4)];
    const dx = (Math.random() - 0.5) * 52, dy = (Math.random() - 0.5) * 52;
    p.style.cssText = `left:${x}px;top:${y}px;background:${c};box-shadow:0 0 5px ${c};--dx:${dx}px;--dy:${dy}px`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }

  (function animRing() {
    rx += (mx - rx) * 0.14; ry += (my - ry) * 0.14;
    if (ringEl) { ringEl.style.left = rx + 'px'; ringEl.style.top = ry + 'px'; }
    requestAnimationFrame(animRing);
  })();

  document.querySelectorAll('a, .btn, button, [data-hover]').forEach(el => {
    el.addEventListener('mouseenter', () => {
      if (ringEl) { ringEl.style.width = '46px'; ringEl.style.height = '46px'; ringEl.style.borderColor = 'rgba(77,217,240,0.8)'; }
      if (glowEl) { glowEl.style.width = '500px'; glowEl.style.height = '500px'; }
    });
    el.addEventListener('mouseleave', () => {
      if (ringEl) { ringEl.style.width = '28px'; ringEl.style.height = '28px'; ringEl.style.borderColor = 'rgba(77,217,240,0.4)'; }
      if (glowEl) { glowEl.style.width = '0'; glowEl.style.height = '0'; }
    });
  });

  const RAIN_CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZアイウエオカキクケ0123456789@#{}[]|<>╔╗╚╝║═';
  let drops = [];
  function initDrops() {
    drops = Array(Math.floor(rainCv.width / 14)).fill(0).map(() => Math.random() * rainCv.height / 14);
  }
  initDrops();
  window.addEventListener('resize', initDrops);

  setInterval(() => {
    rCtx.fillStyle = 'rgba(6,7,9,0.045)';
    rCtx.fillRect(0, 0, rainCv.width, rainCv.height);
    rCtx.font = '12px Courier New';
    const cursorCol = Math.floor(mx / 14);
    drops.forEach((d, i) => {
      const c = RAIN_CH[Math.floor(Math.random() * RAIN_CH.length)];
      const x = i * 14, y = d * 14, r = Math.random();
      const nearCursor = Math.abs(i - cursorCol) <= 2;
      rCtx.fillStyle = nearCursor ? `rgba(77,217,240,${0.6 - Math.abs(i-cursorCol)*0.2})` :
                       r > 0.98 ? '#fff' : r > 0.93 ? '#4dd9f0' : '#0c2010';
      rCtx.fillText(c, x, y);
      if (y > rainCv.height && Math.random() > 0.977) drops[i] = 0;
      drops[i] += 0.45 + Math.random() * 0.28;
    });
  }, 58);

  let currentZone = null, ilT = 0, ilLines = [], ilColor = '#4dd9f0';

  function drawIllus() {
    ilCtx.clearRect(0, 0, ilCv.width, ilCv.height);
    if (!currentZone || !ilLines.length) return;
    const offX = mx < ilCv.width / 2  ? ilCv.width - 340 : 40;
    const offY = my < ilCv.height / 2 ? ilCv.height - 200 : 80;
    ilCtx.font = '11px "JetBrains Mono", monospace';
    const shown = Math.min(ilLines.length, Math.floor(ilT / 60) + 1);
    for (let i = 0; i < shown; i++) {
      const isLast = i === shown - 1;
      const lineStr = isLast ? ilLines[i].substring(0, Math.floor(((ilT % 60) / 60) * ilLines[i].length)) : ilLines[i];
      ilCtx.fillStyle = ilColor;
      ilCtx.globalAlpha = 0.5;
      ilCtx.fillText(lineStr, offX, offY + i * 16);
    }
    ilCtx.globalAlpha = 1;
  }

  function startZone(zone) {
    if (currentZone === zone.id) return;
    currentZone = zone.id; ilLines = zone.art; ilColor = zone.color; ilT = 0;
    ilCv.classList.add('show');
    ilLabel.textContent = zone.label;
    ilLabel.classList.add('show');
  }
  function stopZone() {
    currentZone = null;
    ilCv.classList.remove('show');
    ilLabel.classList.remove('show');
  }

  function checkZones(mx_, my_) {
    for (const zone of ZONES) {
      const el = document.querySelector(zone.sel);
      if (!el) continue;
      const r = el.getBoundingClientRect();
      const PAD = 80;
      if (mx_ > r.left - PAD && mx_ < r.right + PAD && my_ > r.top - PAD && my_ < r.bottom + PAD) {
        startZone(zone); return;
      }
    }
    stopZone();
  }

  (function animIllus() {
    if (currentZone) { ilT += 1.6; drawIllus(); }
    requestAnimationFrame(animIllus);
  })();

})(typeof ZONES !== 'undefined' ? ZONES : []);

function renderTimeline() {
  const YEAR_START = 2019, YEAR_END = 2026, SPAN = YEAR_END - YEAR_START;
  const pct = y => ((y - YEAR_START) / SPAN * 100).toFixed(3);

  // Ruler
  const ruler = document.getElementById('tlRuler');
  let rulerHtml = '';
  for (let y = YEAR_START; y <= YEAR_END; y++) {
    rulerHtml += `<div class="tl-ruler-year">${y}</div>`;
  }
  ruler.innerHTML = rulerHtml;

  // Tracks
  const tracks = document.getElementById('tlTracks');
  const colorMap = {
    '--green':  { bg: 'rgba(61,255,160,0.12)',  border: 'rgba(61,255,160,0.7)'  },
    '--orange': { bg: 'rgba(255,159,74,0.12)',  border: 'rgba(255,159,74,0.7)'  },
    '--purple': { bg: 'rgba(167,139,250,0.12)', border: 'rgba(167,139,250,0.7)' },
    '--cyan':   { bg: 'rgba(77,217,240,0.12)',  border: 'rgba(77,217,240,0.7)'  },
    '--yellow': { bg: 'rgba(251,191,36,0.12)',  border: 'rgba(251,191,36,0.7)'  },
    '--red':    { bg: 'rgba(248,113,113,0.12)', border: 'rgba(248,113,113,0.7)' }
  };
  tracks.innerHTML = CONFIG.timeline.map((job, i) => {
    const l = pct(job.start), w = pct(job.end) - pct(job.start);
    const c = colorMap[job.color] || colorMap['--cyan'];
    const pulse = job.current ? `<span class="tl-pulse"></span>` : '';
    return `
      <div class="tl-track" style="transition-delay:${i*0.15}s">
        <div class="tl-bar" style="left:${l}%;width:${w}%;background:${c.bg};border-left:3px solid ${c.border}">
          <span class="tl-bar-label">${job.company}</span>
          <span class="tl-bar-role">${job.role}</span>
          ${pulse}
        </div>
        <div class="tl-tooltip"><strong style="color:var(${job.color})">${job.company}</strong> · ${job.role}<br>${job.desc}</div>
      </div>`;
  }).join('');

  // Animate bars on scroll
  const tlObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.querySelectorAll('.tl-bar').forEach((bar, i) => {
          setTimeout(() => bar.classList.add('animate'), i * 150);
        });
        tlObs.unobserve(e.target);
      }
    });
  }, { threshold: 0.2 });
  tlObs.observe(tracks);
}

// ── Certifications ───────────────────────────────────────────
function renderCerts() {
  const grid = document.getElementById('certCards');
  grid.innerHTML = CONFIG.certifications.map((c, idx) => {
    const tags = c.tags.map(t => `<span class="cert-tag">${t}</span>`).join('');
    const courseBlock = c.courses ? `
      <div>
        <button class="cert-courses-toggle" onclick="toggleCourses(this)">▸ ${c.courses.length} courses</button>
        <ul class="cert-courses-list">${c.courses.map(course => `<li>${course}</li>`).join('')}</ul>
      </div>` : '<div></div>';
    const verify = c.url ? `<a class="cert-verify" href="${c.url}" target="_blank" rel="noopener noreferrer">verify ↗</a>` : '';
    return `
      <div class="cert-card" style="border-left-color:var(${c.color})">
        <div class="cert-top">
          <span class="cert-badge" style="color:var(${c.color})">${c.badge}</span>
          <div class="cert-info">
            <div class="cert-name">${c.name}</div>
            <div class="cert-meta">${c.issuer} · ${c.date}</div>
          </div>
        </div>
        <div class="cert-tags">${tags}</div>
        <div class="cert-footer">
          ${courseBlock}
          ${verify}
        </div>
      </div>`;
  }).join('');
}

function toggleCourses(btn) {
  const list = btn.nextElementSibling;
  const open = list.classList.toggle('open');
  btn.textContent = (open ? '▾ ' : '▸ ') + btn.textContent.slice(2);
}

// ── Skill Tree ───────────────────────────────────────────────
function polar(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function renderSkillTree() {
  const svg = document.getElementById('skillTreeSvg');
  const CX = 450, CY = 450, R1 = 185, R2 = 340;
  const domains = CONFIG.skillTree;
  const N = domains.length;
  const angleStep = 360 / N;

  // Resolve CSS var colors to actual hex values for SVG
  const colorValues = {
    '--cyan':   '#4dd9f0', '--green':  '#3dffa0', '--orange': '#ff9f4a',
    '--purple': '#a78bfa', '--yellow': '#fbbf24', '--pink':   '#f472b6',
    '--red':    '#f87171'
  };

  let linesHtml = '', domainsHtml = '', leavesHtml = '';

  domains.forEach((dom, di) => {
    const domAngle = di * angleStep;
    const dp = polar(CX, CY, R1, domAngle);
    const col = colorValues[dom.color] || '#4dd9f0';
    const domId = `dom-${dom.id}`;

    // Center → domain line
    linesHtml += `<line class="tree-line" data-dom="${dom.id}" x1="${CX}" y1="${CY}" x2="${dp.x.toFixed(1)}" y2="${dp.y.toFixed(1)}" stroke="${col}" stroke-width="1.5"/>`;

    // Domain node
    domainsHtml += `
      <g class="domain-group" id="${domId}" data-dom="${dom.id}"
         onmouseenter="hlDomain('${dom.id}')" onmouseleave="hlReset()">
        <circle cx="${dp.x.toFixed(1)}" cy="${dp.y.toFixed(1)}" r="28"
          fill="${col}22" stroke="${col}" stroke-width="1.5"
          style="filter:drop-shadow(0 0 6px ${col}55)"/>
        <text x="${dp.x.toFixed(1)}" y="${(dp.y - 4).toFixed(1)}" text-anchor="middle"
          font-size="9" font-family="JetBrains Mono,monospace" fill="${col}" font-weight="600">${dom.icon}</text>
        <text x="${dp.x.toFixed(1)}" y="${(dp.y + 8).toFixed(1)}" text-anchor="middle"
          font-size="8.5" font-family="JetBrains Mono,monospace" fill="${col}">${dom.label}</text>
      </g>`;

    // Leaves
    const leaves = dom.leaves;
    const leafCount = leaves.length;
    const spread = Math.min(40, 80 / leafCount);
    leaves.forEach((leaf, li) => {
      const offset = (li - (leafCount - 1) / 2) * spread;
      const leafAngle = domAngle + offset;
      const lp = polar(CX, CY, R2, leafAngle);

      const lw = Math.max(56, leaf.length * 6.5);
      const lh = 20;

      // Domain → leaf line
      linesHtml += `<line class="tree-line" data-dom="${dom.id}" x1="${dp.x.toFixed(1)}" y1="${dp.y.toFixed(1)}" x2="${lp.x.toFixed(1)}" y2="${lp.y.toFixed(1)}" stroke="${col}" stroke-width="1"/>`;

      leavesHtml += `
        <g class="leaf-group" data-dom="${dom.id}">
          <rect x="${(lp.x - lw/2).toFixed(1)}" y="${(lp.y - lh/2).toFixed(1)}"
            width="${lw}" height="${lh}" rx="10"
            fill="#0f1117" stroke="${col}" stroke-width="1" opacity="0.85"/>
          <text x="${lp.x.toFixed(1)}" y="${(lp.y + 4).toFixed(1)}" text-anchor="middle"
            font-size="8" font-family="JetBrains Mono,monospace" fill="${col}">${leaf}</text>
        </g>`;
    });
  });

  // Center node
  const centerHtml = `
    <g>
      <circle cx="${CX}" cy="${CY}" r="38" fill="#141720" stroke="#4dd9f0" stroke-width="2"
        style="filter:drop-shadow(0 0 14px #4dd9f040)"/>
      <text x="${CX}" y="${CY - 6}" text-anchor="middle"
        font-size="9" font-family="JetBrains Mono,monospace" fill="#4dd9f0" font-weight="700">AI</text>
      <text x="${CX}" y="${CY + 7}" text-anchor="middle"
        font-size="8" font-family="JetBrains Mono,monospace" fill="#5a6380">roshan</text>
    </g>`;

  svg.innerHTML = linesHtml + centerHtml + domainsHtml + leavesHtml;

  // Animate lines on scroll
  svg.querySelectorAll('.tree-line').forEach(line => {
    const len = Math.hypot(
      line.x2.baseVal.value - line.x1.baseVal.value,
      line.y2.baseVal.value - line.y1.baseVal.value
    );
    line.style.strokeDasharray = len;
    line.style.strokeDashoffset = len;
    line.style.transition = 'stroke-dashoffset 0.8s ease, opacity 0.3s';
  });

  const treeObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.querySelectorAll('.tree-line').forEach((line, i) => {
          setTimeout(() => { line.style.strokeDashoffset = '0'; }, i * 30);
        });
        treeObs.unobserve(e.target);
      }
    });
  }, { threshold: 0.15 });
  treeObs.observe(svg);

  // Fallback for mobile
  const fallback = document.getElementById('treeFallback');
  fallback.innerHTML = CONFIG.skillTree.map(dom => {
    const col = colorValues[dom.color] || '#4dd9f0';
    return `
      <div class="tree-branch-card" style="border-left:3px solid ${col}">
        <div class="tree-branch-title" style="color:${col}">${dom.icon} ${dom.label}</div>
        <div class="tree-leaf-list">${dom.leaves.map(l => `<span class="tree-leaf-pill" style="border-color:${col}44;color:${col}">${l}</span>`).join('')}</div>
      </div>`;
  }).join('');
}

// ── Hobbies ──────────────────────────────────────────────────
function renderHobbies() {
  const grid = document.getElementById('hobbiesGrid');
  if (!grid) return;
  grid.innerHTML = CONFIG.hobbies.map(h => `
    <div class="hobby-card">
      <span class="hobby-icon">${h.icon}</span>
      <div>
        <div class="hobby-label">${h.label}</div>
        <div class="hobby-desc">${h.desc}</div>
      </div>
    </div>`).join('');
}

// Terminal streaming text
function typeStream(el, speed) {
  if (!el) return;
  speed = speed || 30;
  const finalHTML = el.innerHTML;
  const text = el.textContent;
  el.textContent = '';
  let i = 0;
  (function tick() {
    if (i < text.length) { el.textContent = text.slice(0, ++i); setTimeout(tick, speed); }
    else { el.innerHTML = finalHTML; }
  })();
}

function hlDomain(id) {
  document.querySelectorAll('.tree-line').forEach(l => l.classList.toggle('dim', l.dataset.dom !== id));
  document.querySelectorAll('.tree-line').forEach(l => l.classList.toggle('hl', l.dataset.dom === id));
  document.querySelectorAll('.leaf-group').forEach(g => g.classList.toggle('dim', g.dataset.dom !== id));
  document.querySelectorAll('.domain-group').forEach(g => g.classList.toggle('dim', g.dataset.dom !== id));
}
function hlReset() {
  document.querySelectorAll('.tree-line, .leaf-group, .domain-group').forEach(el => el.classList.remove('dim','hl'));
}


// Fade in
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      e.target.querySelectorAll('.skill-fill').forEach((bar, i) => {
        setTimeout(() => {
          bar.style.transform = `scaleX(${parseFloat(bar.style.width)/100})`;
        }, i * 80 + 200);
      });
    }
  });
}, { threshold: 0.1 });

const compileObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      compileObs.unobserve(e.target);
    }
  });
}, { threshold: 0.25 });

window.addEventListener('load', () => {
  render();
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
  document.querySelectorAll('.compile-card').forEach(el => compileObs.observe(el));
  typeStream(document.querySelector('.page-header h1'));
});

// ── SCROLL PROGRESS + STATUS BAR ──
(function() {
  const fill = document.getElementById('scroll-fill');
  const pctEl = document.getElementById('term-pct');
  window.addEventListener('scroll', () => {
    const pct = Math.min(100, (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100);
    if (fill) fill.style.width = pct + '%';
    if (pctEl) pctEl.textContent = Math.round(pct) + '%';
  }, { passive: true });
  function updateClock() {
    const el = document.getElementById('term-clock');
    if (!el) return;
    const n = new Date();
    el.textContent = [n.getHours(), n.getMinutes(), n.getSeconds()].map(v => String(v).padStart(2,'0')).join(':');
  }
  updateClock();
  setInterval(updateClock, 1000);
})();
</script>

<div id="scroll-prog"><div id="scroll-fill"></div></div>
<div id="term-bar">
  <span id="term-path">~/roshan/<span id="term-page">about</span></span>
  <span id="term-center">roshan.dev · ai solutions consultant</span>
  <span id="term-right"><span id="term-pct">0%</span> · <span id="term-clock"></span></span>
</div>
