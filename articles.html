<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://www.clarity.ms https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.clarity.ms; connect-src 'self' https://cloudflareinsights.com https://www.clarity.ms; base-uri 'self'">

<title>~/user — articles</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100;0,300;0,400;0,600;0,700;1,300&family=Oxanium:wght@400;600;700;800&family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #0a0b0d;
    --bg2: #0f1117;
    --bg3: #141720;
    --border: #1e2230;
    --dim: #3a4055;
    --muted: #5a6380;
    --text: #c8cfe8;
    --bright: #e8eeff;
    --cyan: #4dd9f0;
    --green: #3dffa0;
    --orange: #ff9f4a;
    --purple: #a78bfa;
    --pink: #f472b6;
    --yellow: #fbbf24;
    --red: #f87171;
    --font-mono: 'JetBrains Mono', monospace;
    --font-display: 'Oxanium', sans-serif;
    --font-label: 'Share Tech Mono', monospace;
    --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 48px; --s6: 64px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.8;
    overflow-x: hidden;
    cursor: none;
  }

  .cursor {
    width: 6px; height: 6px;
    background: var(--cyan);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px var(--cyan);
  }
  .cursor-ring {
    width: 28px; height: 28px;
    border: 1px solid rgba(77,217,240,0.4);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: all 0.15s ease;
  }

  #rain-cv { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 1; pointer-events: none; }
  #illus-cv { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; }
  #illus-cv.show { opacity: 1; }
  #dot-field { position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background-image: radial-gradient(circle, var(--dim) 1px, transparent 1px);
    background-size: 28px 28px; }
  #cur-glow { position: fixed; z-index: 3; pointer-events: none; border-radius: 50%;
    width: 0; height: 0;
    background: radial-gradient(circle, rgba(77,217,240,0.06) 0%, transparent 65%);
    transform: translate(-50%, -50%);
    transition: left 0.06s linear, top 0.06s linear, width 0.4s ease, height 0.4s ease; }
  #vign { position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%); }
  #illus-label { position: fixed; z-index: 50; font-family: var(--font-label); font-size: 9px;
    letter-spacing: 1.5px; color: var(--cyan); background: rgba(6,7,9,0.85);
    border: 1px solid rgba(77,217,240,0.25); border-radius: 3px; padding: 4px 10px;
    pointer-events: none; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
  #illus-label.show { opacity: 1; }
  .cursor { box-shadow: 0 0 10px var(--cyan); }
  .cursor-ring { transition: width 0.15s, height 0.15s, border-color 0.15s; }
  .particle-trail { position: fixed; pointer-events: none; z-index: 9997; border-radius: 50%;
    width: 3px; height: 3px; animation: pt-fade 0.7s ease-out forwards; }
  @keyframes pt-fade { to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); } }
  .compile-card { position: relative; overflow: hidden; }
  .compile-overlay {
    position: absolute; inset: 0; padding: 14px 16px;
    font-size: 9px; line-height: 1.5; color: var(--dim);
    white-space: pre; pointer-events: none; background: inherit; z-index: 1;
    opacity: 1; transition: opacity 0.25s ease;
  }
  .compile-card.visible .compile-overlay { opacity: 0; transition-delay: 0.2s; }
  .compile-real { opacity: 0; transition: opacity 0.3s ease 0.35s; }
  .compile-card.visible .compile-real { opacity: 1; }
  .compile-card::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.5s ease 0.15s; z-index: 2;
  }
  .compile-card.visible::after { transform: scaleX(1); }
  @media (max-width: 768px) {
    #rain-cv, #illus-cv, #dot-field, #cur-glow, #vign, #illus-label { display: none; }
    .cursor, .cursor-ring { display: none; }
    body { cursor: auto; }
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.09) 3px, rgba(0,0,0,0.09) 6px);
    pointer-events: none;
    z-index: 4;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 40px;
    background: rgba(10,11,13,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--cyan);
    letter-spacing: 0.05em;
    text-decoration: none;
  }
  .nav-logo span { color: var(--muted); }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }
  .nav-links a {
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.2s;
    cursor: none;
  }
  .nav-links a::before {
    content: '> ';
    color: var(--green);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .nav-links a:hover { color: var(--bright); }
  .nav-links a:hover::before { opacity: 1; }
  .nav-links a.active { color: var(--cyan); }

  .nav-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .status-dot {
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  main {
    padding: 120px 60px 80px;
    max-width: 900px;
    margin: 0 auto;
  }

  .page-header {
    margin-bottom: 60px;
    animation: phIn 0.6s ease 0.05s both;
  }
  @keyframes phIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .page-header h1 {
    font-family: var(--font-display);
    font-size: clamp(36px, 5vw, 56px);
    font-weight: 800;
    color: var(--bright);
    margin-bottom: 16px;
  }
  .page-header h1 em {
    font-style: normal;
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .page-header .breadcrumb {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 24px;
  }
  .page-header .breadcrumb a {
    color: var(--cyan);
    text-decoration: none;
  }

  .page-header .subtitle {
    font-size: 14px;
    color: var(--muted);
    max-width: 500px;
  }

  .filter-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 48px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 6px 16px;
    font-family: var(--font-label);
    font-size: 11px;
    letter-spacing: 1.5px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--muted);
    cursor: none;
    transition: all 0.2s;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--cyan);
    color: var(--cyan);
    background: rgba(77,217,240,0.05);
  }

  .articles-list { display: grid; gap: 1px; }

  .article-card {
    display: block;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 32px;
    margin-bottom: 24px;
    cursor: none;
    text-decoration: none;
    transition: all 0.3s;
    position: relative;
  }
  .article-card:hover {
    border-color: var(--cyan);
  }
  /* .article-card::before replaced by .article-accent real div for stagger animation */
  .article-accent { position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--cyan); transform:scaleY(0); transform-origin:top; }

  .article-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }

  .article-date {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .article-read-time {
    font-size: 10px;
    color: var(--dim);
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 2px;
  }

  .article-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    color: var(--bright);
    margin-bottom: 12px;
    transition: color 0.2s;
  }
  .article-card:hover .article-title { color: var(--cyan); }

  .article-excerpt {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.8;
    margin-bottom: 20px;
  }

  .article-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .atag {
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 2px;
    letter-spacing: 0.06em;
  }
  .atag-c { background: rgba(77,217,240,0.1); color: var(--cyan); }
  .atag-g { background: rgba(61,255,160,0.1); color: var(--green); }
  .atag-o { background: rgba(255,159,74,0.1); color: var(--orange); }
  .atag-p { background: rgba(167,139,250,0.1); color: var(--purple); }

  .article-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .read-more {
    font-size: 11px;
    color: var(--cyan);
    letter-spacing: 0.08em;
  }

  .article-arrow {
    font-size: 18px;
    color: var(--border);
    transition: all 0.2s;
  }
  .article-card:hover .article-arrow {
    color: var(--cyan);
    transform: translateX(4px);
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 32px 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
  }

  .fade-up {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .fade-up.visible {
    opacity: 1;
    transform: none;
  }

  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(61,255,160,0.4); } 50% { box-shadow: 0 0 0 5px rgba(61,255,160,0); } }

  /* ── SCROLL PROGRESS ── */
  #scroll-prog { position: fixed; top: 0; left: 0; right: 0; height: 2px; background: rgba(77,217,240,0.08); z-index: 10000; pointer-events: none; }
  #scroll-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--green)); transition: width 0.1s linear; }

  /* ── TERMINAL STATUS BAR ── */
  #term-bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 28px;
    background: rgba(10,11,13,0.92); border-top: 1px solid rgba(77,217,240,0.1);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    font-family: 'Share Tech Mono', monospace; font-size: 10px;
    color: rgba(200,207,232,0.35); letter-spacing: 0.08em;
    z-index: 200; pointer-events: none;
  }
  #term-path { color: rgba(77,217,240,0.5); }
  #term-right { color: rgba(61,255,160,0.4); }
  @media (max-width: 768px) { #term-bar, #scroll-prog { display: none; } }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 900px) {
    nav { padding: 16px 24px; }
    main { padding: 100px 24px 60px; }
    footer { flex-direction: column; gap: 12px; text-align: center; }
  }

  /* Touch: hide custom cursor */
  @media (hover: none) {
    body { cursor: auto; }
    .cursor, .cursor-ring { display: none; }
  }

  /* Nav overflow on small phones */
  @media (max-width: 520px) {
    .nav-links { gap: 16px; }
    .nav-links a { font-size: 10px; letter-spacing: 0.06em; }
    .nav-status { display: none; }
  }

  /* Expanded article body */
  .article-body {
    display: none;
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .article-body.open { display: block; }
  .article-body p {
    font-size: 13px;
    color: var(--text);
    line-height: 1.95;
    margin-bottom: 18px;
  }
  .article-body p strong { color: var(--cyan); font-weight: 400; }
  .article-body p code {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--orange);
  }
  .article-body img {
    width: 100%;
    max-width: 680px;
    border: 1px solid var(--border);
    border-radius: 4px;
    margin: 20px 0;
    display: block;
    opacity: 0.92;
  }
  .article-body .img-caption {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.06em;
    margin-top: -14px;
    margin-bottom: 18px;
  }
  .article-close-btn {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
    cursor: pointer;
    background: none;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 4px 12px;
    font-family: var(--font-mono);
    transition: all 0.2s;
    margin-top: 8px;
  }
  .article-close-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .article-card.expanded { border-color: var(--cyan); }
  .article-card.expanded .article-accent { transform: scaleY(1); }
  .article-card { cursor: pointer; }
  .article-card.hidden { display: none; }

  /* ── UPTIME WIDGET ── */
  #uptime-widget { position:fixed; bottom:30px; right:20px; font-family:'Share Tech Mono',monospace; font-size:9px; color:rgba(61,255,160,0.3); letter-spacing:0.08em; z-index:199; pointer-events:none; }
  @media (max-width:768px) { #uptime-widget { display:none; } }

  /* ── COMMAND PALETTE ── */
  #cmd-palette { position:fixed; inset:0; z-index:9000; }
  #cmd-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); }
  #cmd-modal { position:absolute; top:20%; left:50%; transform:translateX(-50%); width:min(600px,90vw); background:var(--bg2); border:1px solid var(--cyan); border-radius:6px; box-shadow:0 0 60px rgba(77,217,240,0.2); overflow:hidden; font-family:var(--font-mono); }
  #cmd-input-row { display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--border); }
  #cmd-prompt { color:var(--cyan); font-size:14px; }
  #cmd-input { flex:1; background:transparent; border:none; outline:none; color:var(--bright); font-size:13px; font-family:var(--font-mono); cursor:text; }
  #cmd-input::placeholder { color:var(--dim); }
  #cmd-results { max-height:320px; overflow-y:auto; padding:8px 0; }
  .cmd-item { display:flex; align-items:center; gap:12px; padding:10px 20px; transition:background 0.1s; }
  .cmd-item:hover, .cmd-item.selected { background:rgba(77,217,240,0.08); }
  .cmd-item-icon { color:var(--muted); font-size:12px; min-width:20px; }
  .cmd-item-title { color:var(--bright); font-size:12px; }
  .cmd-item-sub { color:var(--muted); font-size:11px; margin-left:auto; }
  #cmd-footer { padding:8px 20px; font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--dim); border-top:1px solid var(--border); letter-spacing:0.1em; }
</style>

<nav>

<script>
const ZONES = [
  {
    id: 'articles-list', sel: '.articles-list',
    label: '// articles index',
    color: '#3dffa0',
    art: [
      '  cat articles/index.md         ',
      '  ┌──────────────────────────┐  ',
      '  │ # LLMOps in Production   │  ',
      '  │ # RAG Beyond Basics      │  ',
      '  │ # Agent Architecture     │  ',
      '  │ # Vector DB Benchmark    │  ',
      '  └──────────────────────────┘  ',
    ]
  },
  {
    id: 'tag-filter', sel: '.filter-bar',
    label: '// grep --color=auto',
    color: '#f472b6',
    art: [
      '  grep -r "llmops" ./articles   ',
      '  > LLMOps in Production.md     ',
      '  > CI for LLM Pipelines.md     ',
      '                                ',
      '  grep -r "rag" ./articles      ',
      '  > RAG Beyond Basics.md        ',
    ]
  },
];

(function initEffects(ZONES) {
  if (window.innerWidth <= 768) return;
  const curEl = document.getElementById('cursor');
  const ringEl = document.getElementById('cursorRing');
  const glowEl = document.getElementById('cur-glow');
  const ilCv = document.getElementById('illus-cv');
  const ilCtx = ilCv.getContext('2d');
  const ilLabel = document.getElementById('illus-label');
  const rainCv = document.getElementById('rain-cv');
  const rCtx = rainCv.getContext('2d');
  let mx = window.innerWidth / 2, my = window.innerHeight / 2;
  let rx = mx, ry = my;
  function resizeCv() { rainCv.width = ilCv.width = window.innerWidth; rainCv.height = ilCv.height = window.innerHeight; }
  resizeCv(); window.addEventListener('resize', resizeCv);
  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    if (curEl) { curEl.style.left = mx + 'px'; curEl.style.top = my + 'px'; }
    if (glowEl) { glowEl.style.left = mx + 'px'; glowEl.style.top = my + 'px'; }
    ilLabel.style.left = (mx + 16) + 'px'; ilLabel.style.top = (my - 28) + 'px';
    if (Math.random() > 0.68) spawnParticle(mx, my);
    checkZones(mx, my);
  });
  function spawnParticle(x, y) {
    const p = document.createElement('div'); p.className = 'particle-trail';
    const cols = ['#4dd9f0','#3dffa0','#a78bfa','#f472b6'];
    const c = cols[Math.floor(Math.random() * 4)];
    const dx = (Math.random() - 0.5) * 52, dy = (Math.random() - 0.5) * 52;

function toggleArticle(e, closeBtn, idx) {
  // If triggered by close button inside card, don't re-toggle
  if (closeBtn) {
    e.stopPropagation();
    const card = closeBtn.closest('.article-card');
    card.querySelector('.article-body').classList.remove('open');
    card.classList.remove('expanded');
    return;
  }
  // Don't toggle if clicking on a tag or button
  if (e.target.closest('.atag') || e.target.closest('button')) return;
  const card = e.currentTarget;
  const body = card.querySelector('.article-body');
  const isOpen = body.classList.contains('open');
  // Close all others
  document.querySelectorAll('.article-card.expanded').forEach(c => {
    c.querySelector('.article-body').classList.remove('open');
    c.classList.remove('expanded');
  });
  if (!isOpen) {
    body.classList.add('open');
    card.classList.add('expanded');
    setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
  }
}

// Terminal streaming text
function typeStream(el, speed) {
  if (!el) return;
  speed = speed || 30;
  const finalHTML = el.innerHTML;
  const text = el.textContent;
  el.textContent = '';
  let i = 0;
  (function tick() {
    if (i < text.length) { el.textContent = text.slice(0, ++i); setTimeout(tick, speed); }
    else { el.innerHTML = finalHTML; }
  })();
}


const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
  });
}, { threshold: 0.25 });

const compileObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const card = e.target;
    const overlay = card.querySelector('.compile-overlay');
    if (!overlay) { card.classList.add('visible'); compileObs.unobserve(card); return; }
    const progLine = document.createElement('div');
    progLine.style.cssText = 'margin-top:6px;color:#4dd9f0;font-size:9px;font-family:monospace';
    progLine.textContent = '[□□□□□□ 0%]  errors: 0  warnings: 0';
    overlay.appendChild(progLine);
    let pct = 0;
    const iv = setInterval(() => {
      pct = Math.min(pct + 4, 100);
      const filled = Math.round(pct / 100 * 6);
      progLine.textContent = `[${'■'.repeat(filled)}${'□'.repeat(6 - filled)} ${pct}%]  errors: 0  warnings: 0`;
      if (pct >= 100) { clearInterval(iv); setTimeout(() => { card.classList.add('visible'); compileObs.unobserve(card); }, 180); }
    }, 14);
  });
}, { threshold: 0.25 });

function charStagger(el, delay) {
  if (!el) return;
  const text = el.textContent;
  el.innerHTML = '';
  [...text].forEach((ch, i) => {
    const s = document.createElement('span');
    s.style.cssText = 'display:inline-block;opacity:0;transform:translateY(18px);transition:opacity 0.35s ease,transform 0.35s cubic-bezier(0.34,1.56,0.64,1)';
    s.textContent = ch === ' ' ? ' ' : ch;
    el.appendChild(s);
    setTimeout(() => { s.style.opacity = '1'; s.style.transform = 'none'; }, delay + i * 38);
  });
}

function staggerAccents() {
  if (typeof anime === 'undefined') return;
  document.querySelectorAll('.article-accent').forEach((acc, i) => {
    anime({ targets: acc, scaleY: 1, duration: 400, delay: i * 120, ease: 'outQuad' });
  });
}

function setupSpringHovers() {
  if (typeof anime === 'undefined') return;
  const sp = anime.createSpring({ mass: 1, stiffness: 80, damping: 10 });
  document.querySelectorAll('.article-card').forEach(el => {
    el.addEventListener('mouseenter', () => anime({ targets: el, translateY: -6, ease: sp }));
    el.addEventListener('mouseleave', () => anime({ targets: el, translateY: 0, ease: sp }));
  });
}

window.addEventListener('load', () => {

});
