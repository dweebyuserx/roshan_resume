<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://www.clarity.ms https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.clarity.ms; connect-src 'self' https://cloudflareinsights.com https://www.clarity.ms; base-uri 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>~/user — projects</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100;0,300;0,400;0,600;0,700;1,300&family=Oxanium:wght@400;600;700;800&family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #0a0b0d;
    --bg2: #0f1117;
    --bg3: #141720;
    --border: #1e2230;
    --dim: #3a4055;
    --muted: #5a6380;
    --text: #c8cfe8;
    --bright: #e8eeff;
    --cyan: #4dd9f0;
    --green: #3dffa0;
    --orange: #ff9f4a;
    --purple: #a78bfa;
    --pink: #f472b6;
    --yellow: #fbbf24;
    --red: #f87171;
    --font-mono: 'JetBrains Mono', monospace;
    --font-display: 'Oxanium', sans-serif;
    --font-label: 'Share Tech Mono', monospace;
    --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 48px; --s6: 64px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.8;
    overflow-x: hidden;
    cursor: none;
  }

  .cursor {
    width: 6px; height: 6px;
    background: var(--cyan);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px var(--cyan);
  }
  .cursor-ring {
    width: 28px; height: 28px;
    border: 1px solid rgba(77,217,240,0.4);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: all 0.15s ease;
  }

  /* ── EFFECT LAYERS ── */
  #rain-cv { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 1; pointer-events: none; }
  #illus-cv { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; }
  #illus-cv.show { opacity: 1; }
  #dot-field { position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background-image: radial-gradient(circle, var(--dim) 1px, transparent 1px);
    background-size: 28px 28px; }
  #cur-glow { position: fixed; z-index: 3; pointer-events: none; border-radius: 50%;
    width: 0; height: 0;
    background: radial-gradient(circle, rgba(77,217,240,0.06) 0%, transparent 65%);
    transform: translate(-50%, -50%);
    transition: left 0.06s linear, top 0.06s linear, width 0.4s ease, height 0.4s ease; }
  #vign { position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%); }
  #illus-label { position: fixed; z-index: 50; font-family: var(--font-label); font-size: 9px;
    letter-spacing: 1.5px; color: var(--cyan); background: rgba(6,7,9,0.85);
    border: 1px solid rgba(77,217,240,0.25); border-radius: 3px; padding: 4px 10px;
    pointer-events: none; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
  #illus-label.show { opacity: 1; }
  .cursor { box-shadow: 0 0 10px var(--cyan); }
  .cursor-ring { transition: width 0.15s, height 0.15s, border-color 0.15s; }
  .particle-trail { position: fixed; pointer-events: none; z-index: 9997; border-radius: 50%;
    width: 3px; height: 3px; animation: pt-fade 0.7s ease-out forwards; }
  @keyframes pt-fade { to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); } }
  .compile-card { position: relative; overflow: hidden; }
  .compile-overlay {
    position: absolute; inset: 0; padding: 14px 16px;
    font-size: 9px; line-height: 1.5; color: var(--dim);
    white-space: pre; pointer-events: none;
    background: inherit; z-index: 1;
    opacity: 1; transition: opacity 0.25s ease;
  }
  .compile-card.visible .compile-overlay { opacity: 0; transition-delay: 0.2s; }
  .compile-real { opacity: 0; transition: opacity 0.3s ease 0.35s; }
  .compile-card.visible .compile-real { opacity: 1; }
  .compile-card::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.5s ease 0.15s; z-index: 2;
  }
  .compile-card.visible::after { transform: scaleX(1); }
  @media (max-width: 768px) {
    #rain-cv, #illus-cv, #dot-field, #cur-glow, #vign, #illus-label { display: none; }
    .cursor, .cursor-ring { display: none; }
    body { cursor: auto; }
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.09) 2px, rgba(0,0,0,0.09) 3px);
    pointer-events: none;
    z-index: 4;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 40px;
    background: rgba(10,11,13,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--cyan);
    letter-spacing: 0.05em;
    text-decoration: none;
  }
  .nav-logo span { color: var(--muted); }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }
  .nav-links a {
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.2s;
    cursor: none;
  }
  .nav-links a::before {
    content: '> ';
    color: var(--green);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .nav-links a:hover { color: var(--bright); }
  .nav-links a:hover::before { opacity: 1; }
  .nav-links a.active { color: var(--cyan); }

  .nav-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .status-dot {
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  main {
    padding: 120px 60px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .page-header {
    margin-bottom: 60px;
    animation: phIn 0.6s ease 0.05s both;
  }
  @keyframes phIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .page-header h1 {
    font-family: var(--font-display);
    font-size: clamp(36px, 5vw, 56px);
    font-weight: 800;
    color: var(--bright);
    margin-bottom: 16px;
  }
  .page-header h1 em {
    font-style: normal;
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .page-header .breadcrumb {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 24px;
  }
  .page-header .breadcrumb a {
    color: var(--cyan);
    text-decoration: none;
  }

  .page-header .subtitle {
    font-size: 14px;
    color: var(--muted);
    max-width: 600px;
  }

  .projects-stats {
    display: flex;
    gap: 48px;
    margin: 48px 0;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat-item {
    text-align: center;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 800;
    color: var(--cyan);
  }

  .stat-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .section-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .section-label::before { content: attr(data-n); color: var(--cyan); }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
    max-width: 200px;
  }

  .featured-project {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 48px;
    margin-bottom: 48px;
    position: relative;
    overflow: hidden;
  }
  .featured-project::before {
    content: 'FEATURED';
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 9px;
    letter-spacing: 0.15em;
    padding: 4px 10px;
    background: rgba(77,217,240,0.1);
    color: var(--cyan);
    border-radius: 2px;
  }

  .featured-header {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    margin-bottom: 24px;
  }

  .featured-icon {
    font-size: 48px;
    line-height: 1;
  }

  .featured-title {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 800;
    color: var(--bright);
    margin-bottom: 8px;
  }

  .featured-tagline {
    font-size: 13px;
    color: var(--cyan);
  }

  .featured-desc {
    font-size: 14px;
    color: var(--text);
    line-height: 1.9;
    margin-bottom: 24px;
    max-width: 700px;
  }

  .featured-tech {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }

  .tech-pill {
    font-size: 10px;
    padding: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--dim);
    letter-spacing: 0.06em;
  }
  .tech-pill-cyan   { border-color: rgba(77,217,240,0.35);  color: var(--cyan);   background: rgba(77,217,240,0.06); }
  .tech-pill-green  { border-color: rgba(61,255,160,0.35);  color: var(--green);  background: rgba(61,255,160,0.06); }
  .tech-pill-orange { border-color: rgba(255,159,74,0.35);  color: var(--orange); background: rgba(255,159,74,0.06); }
  .tech-pill-purple { border-color: rgba(167,139,250,0.35); color: var(--purple); background: rgba(167,139,250,0.06); }
  .tech-pill-yellow { border-color: rgba(251,191,36,0.35);  color: var(--yellow); background: rgba(251,191,36,0.06); }
  .tech-pill-pink   { border-color: rgba(244,114,182,0.35); color: var(--pink);   background: rgba(244,114,182,0.06); }
  .tech-pill-cyan   { border-color: rgba(77,217,240,0.35);  color: var(--cyan);   background: rgba(77,217,240,0.06); }
  .tech-pill-green  { border-color: rgba(61,255,160,0.35);  color: var(--green);  background: rgba(61,255,160,0.06); }
  .tech-pill-orange { border-color: rgba(255,159,74,0.35);  color: var(--orange); background: rgba(255,159,74,0.06); }
  .tech-pill-purple { border-color: rgba(167,139,250,0.35); color: var(--purple); background: rgba(167,139,250,0.06); }
  .tech-pill-pink   { border-color: rgba(244,114,182,0.35); color: var(--pink);   background: rgba(244,114,182,0.06); }
  .tech-pill-yellow { border-color: rgba(251,191,36,0.35);  color: var(--yellow); background: rgba(251,191,36,0.06); }
  .tech-pill-red    { border-color: rgba(248,113,113,0.35); color: var(--red);    background: rgba(248,113,113,0.06); }

  .featured-links {
    display: flex;
    gap: 20px;
  }

  .plink {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.06em;
    transition: color 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: none;
  }
  .plink:hover { color: var(--cyan); }

  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 24px;
  }

  .project-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px;
    position: relative;
    cursor: none;
    overflow: hidden;
    transition: all 0.3s;
  }
  .project-card:hover {
    background: var(--bg3);
    border-color: var(--accent, var(--cyan));
  }

  .project-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent, var(--cyan));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s;
  }
  .project-card:hover::after { transform: scaleX(1); }

  .project-icon {
    font-size: 24px;
    margin-bottom: 16px;
    display: block;
  }

  .project-name {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 700;
    color: var(--bright);
    margin-bottom: 8px;
  }

  .project-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 20px;
  }

  .project-tech {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }

  .project-links {
    display: flex;
    gap: 16px;
  }

  .builds-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border-radius: 10px;
    background: rgba(77,217,240,0.07);
    border: 1px solid rgba(77,217,240,0.2);
    color: var(--cyan);
    margin-bottom: 10px;
  }
  .builds-badge span { color: var(--bright); font-weight: 600; }
  .variants-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin: 8px 0 12px;
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 4px;
    border-left: 2px solid var(--border);
  }
  .variant-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 10px;
  }
  .variant-label {
    color: var(--dim);
    min-width: 14px;
    text-align: right;
  }
  .variant-text { color: var(--muted); line-height: 1.5; }
  .variant-tech { color: var(--dim); font-size: 9px; }

  footer {
    border-top: 1px solid var(--border);
    padding: 32px 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
  }

  .fade-up.visible { }

  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(61,255,160,0.4); } 50% { box-shadow: 0 0 0 5px rgba(61,255,160,0); } }

  /* ── SCROLL PROGRESS ── */
  #scroll-prog { position: fixed; top: 0; left: 0; right: 0; height: 2px; background: rgba(77,217,240,0.08); z-index: 10000; pointer-events: none; }
  #scroll-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--green)); transition: width 0.1s linear; }

  /* ── TERMINAL STATUS BAR ── */
  #term-bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 28px;
    background: rgba(10,11,13,0.92); border-top: 1px solid rgba(77,217,240,0.1);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    font-family: 'Share Tech Mono', monospace; font-size: 10px;
    color: rgba(200,207,232,0.35); letter-spacing: 0.08em;
    z-index: 200; pointer-events: none;
  }
  #term-path { color: rgba(77,217,240,0.5); }
  #term-right { color: rgba(61,255,160,0.4); }
  @media (max-width: 768px) { #term-bar, #scroll-prog { display: none; } }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 900px) {
    nav { padding: 16px 24px; }
    main { padding: 100px 24px 60px; }
    .projects-stats { flex-wrap: wrap; gap: 24px; }
    .featured-project { padding: 24px; }
    .featured-header { flex-direction: column; gap: 16px; }
    footer { flex-direction: column; gap: 12px; text-align: center; }
  }

  /* Active card */
  .project-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), inset 0 0 24px rgba(0,0,0,0.3);
    transform: translateY(-2px);
  }

  /* Click-to-feature hint */
  .swap-hint {
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 0.08em;
    margin-top: 12px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .project-card:hover .swap-hint { opacity: 1; }

  /* Featured panel fade transition */
  .featured-swap { transition: opacity 0.25s; }
  .featured-swap.fading { opacity: 0; }

  /* Variant table inside featured panel */
  .feat-variants {
    margin: 16px 0;
    padding: 14px 16px;
    background: var(--bg);
    border-radius: 4px;
    border-left: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .feat-variant-row { display: flex; align-items: baseline; gap: 10px; font-size: 11px; }
  .feat-variant-label { color: var(--dim); min-width: 20px; text-align: right; flex-shrink: 0; }
  .feat-variant-text { color: var(--muted); line-height: 1.5; }
  .feat-variant-tech { color: var(--dim); font-size: 10px; }

  /* Touch: hide custom cursor */
  @media (hover: none) {
    body { cursor: auto; }
    .cursor, .cursor-ring { display: none; }
  }

  /* 1-col grid on small phones */
  @media (max-width: 600px) { .projects-grid { grid-template-columns: 1fr; } }

  /* Nav overflow on small phones */
  @media (max-width: 520px) {
    .nav-links { gap: 16px; }
    .nav-links a { font-size: 10px; letter-spacing: 0.06em; }
    .nav-status { display: none; }
  }

  /* ── UPTIME WIDGET ── */
  #uptime-widget { position:fixed; bottom:30px; right:20px; font-family:'Share Tech Mono',monospace; font-size:9px; color:rgba(61,255,160,0.3); letter-spacing:0.08em; z-index:199; pointer-events:none; }
  @media (max-width:768px) { #uptime-widget { display:none; } }

  /* ── GIT DIFF TAB ── */
  .feat-tabs { display:flex; gap:8px; margin-bottom:20px; }
  .feat-tab { font-family:var(--font-mono); font-size:11px; padding:4px 12px; background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:2px; cursor:none; transition:all 0.2s; }
  .feat-tab.active { border-color:var(--cyan); color:var(--cyan); }
  .feat-diff-view { font-family:var(--font-mono); font-size:11px; line-height:1.8; display:none; }
  .diff-add { color:var(--green); }
  .diff-del { color:var(--red); }
  .diff-hunk { color:var(--purple); font-size:10px; }

  /* ── FEAT STATS + ASCII ── */
  .feat-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:16px 0; }
  .feat-stat-box { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:10px 6px; text-align:center; }
  .feat-stat-num { font-family:var(--font-display); font-size:22px; line-height:1; }
  .feat-stat-lbl { font-size:8px; color:var(--dim); margin-top:3px; letter-spacing:.1em; }
  .feat-ascii { margin:12px 0; }
  .feat-ascii-row { display:flex; align-items:baseline; gap:0; margin-bottom:5px; font-family:var(--font-mono); font-size:11px; opacity:0; }
  .feat-ascii-key { color:var(--dim); width:90px; flex-shrink:0; }
  .feat-ascii-bar { color:var(--green); white-space:pre; }
  .feat-ascii-tag { font-size:9px; margin-left:8px; }
  @media (max-width:600px) { .feat-stats { grid-template-columns:repeat(2,1fr); } }

  /* ── COMMAND PALETTE ── */
  #cmd-palette { position:fixed; inset:0; z-index:9000; }
  #cmd-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); }
  #cmd-modal { position:absolute; top:20%; left:50%; transform:translateX(-50%); width:min(560px,90vw); background:var(--bg2); border:1px solid var(--border); border-radius:6px; overflow:hidden; box-shadow:0 24px 80px rgba(0,0,0,0.6); }
  #cmd-input-row { display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--border); }
  #cmd-prompt { color:var(--cyan); font-family:var(--font-mono); font-size:14px; }
  #cmd-input { flex:1; background:transparent; border:none; outline:none; color:var(--bright); font-family:var(--font-mono); font-size:13px; }

(function initEffects(ZONES) {
  if (window.innerWidth <= 768) return;

    if (Math.random() > 0.68) spawnParticle(mx, my);

  function spawnParticle(x, y) {
    const p = document.createElement('div'); p.className = 'particle-trail';
    const cols = ['#4dd9f0','#3dffa0','#a78bfa','#f472b6'];
    const c = cols[Math.floor(Math.random() * 4)];

    p.style.cssText = `left:${x}px;top:${y}px;background:${c};box-shadow:0 0 5px ${c};--dx:${dx}px;--dy:${dy}px`;

  });
  const RAIN_CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZアイウエオカキクケ0123456789@#{}[]|<>╔╗╚╝║═';
  let drops = [];
  function initDrops() { drops = Array(Math.floor(rainCv.width / 14)).fill(0).map(() => Math.random() * rainCv.height / 14); }
  initDrops(); window.addEventListener('resize', initDrops);
  setInterval(() => {
    rCtx.fillStyle = 'rgba(6,7,9,0.045)'; rCtx.fillRect(0, 0, rainCv.width, rainCv.height); rCtx.font = '12px Courier New';
    const cursorCol = Math.floor(mx / 14);
    drops.forEach((d, i) => {
      const c = RAIN_CH[Math.floor(Math.random() * RAIN_CH.length)]; const x = i * 14, y = d * 14, r = Math.random();
      const nearCursor = Math.abs(i - cursorCol) <= 2;
      rCtx.fillStyle = nearCursor ? `rgba(77,217,240,${0.6 - Math.abs(i-cursorCol)*0.2})` : r > 0.98 ? '#fff' : r > 0.93 ? '#4dd9f0' : '#0c2010';

      if (y > rainCv.height && Math.random() > 0.977) drops[i] = 0; drops[i] += 0.45 + Math.random() * 0.28;

  let currentZone = null, ilT = 0, ilLines = [], ilColor = '#4dd9f0';
  function drawIllus() {
    ilCtx.clearRect(0, 0, ilCv.width, ilCv.height); if (!currentZone || !ilLines.length) return;

// Terminal streaming text
function typeStream(el, speed) {
  if (!el) return;
  speed = speed || 30;
  const finalHTML = el.innerHTML;
  const text = el.textContent;
  el.textContent = '';
  let i = 0;
  (function tick() {
    if (i < text.length) { el.textContent = text.slice(0, ++i); setTimeout(tick, speed); }
    else { el.innerHTML = finalHTML; }
  })();
}

function buildStatsHtml(stats) {
  return stats.map(s => `
    <div class="feat-stat-box">
      <div class="feat-stat-num" style="color:${s.c}">${typeof s.v === 'number' ? '0' : s.v}</div>
      <div class="feat-stat-lbl">${s.l}</div>
    </div>`).join('');
}

function buildAsciiHtml(ascii) {
  return ascii.map((r, i) => `
    <div class="feat-ascii-row" id="far${i}">
      <span class="feat-ascii-key">${r.k}</span><span class="feat-ascii-bar" id="fab${i}"></span><span class="feat-ascii-tag" style="color:${r.c}">${r.t}</span>
    </div>`).join('');
}

function animateFeatPanel(p, animatePills) {
  if (typeof anime === 'undefined') return;
  const statsEl = document.getElementById('featStats');
  const asciiEl = document.getElementById('featAscii');

  if (statsEl && p.stats) {
    p.stats.forEach((s, i) => {
      const el = statsEl.querySelectorAll('.feat-stat-num')[i];
      if (!el) return;
      if (typeof s.v === 'number' && s.v > 0) {
        const obj = {val: 0};
        anime({ targets: obj, val: s.v, duration: 600, ease: 'outQuart', delay: i * 80,
          update() { el.textContent = Math.round(obj.val); },
          complete() { el.textContent = s.v; }
        });
      } else {
        anime({ targets: el, opacity: [0, 1], duration: 250, delay: i * 80, ease: 'outQuad' });
      }
    });
  }

  if (asciiEl && p.ascii) {
    p.ascii.forEach((r, i) => {
      const row = document.getElementById('far'+i);
      const bar = document.getElementById('fab'+i);
      if (!row || !bar) return;
      anime({ targets: row, opacity: [0, 1], duration: 180, delay: 300 + i * 90, ease: 'outQuad',
        complete() {
          const full = '█'.repeat(r.n) + '░'.repeat(20 - r.n);
          let ci = 0;
          const iv = setInterval(() => {
            if (ci <= full.length) { bar.textContent = full.slice(0, ci++); }
            else clearInterval(iv);
          }, 16);
        }
      });
    });
  }

  if (animatePills) {
    const sp = anime.createSpring({ mass: 1, stiffness: 130, damping: 11 });
    anime({ targets: '#featuredSwap .tech-pill', opacity: [0, 1], translateY: [5, 0], duration: 400, ease: sp,
      delay: anime.stagger(30, { start: 500 }) });
  }
}

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) e.target.classList.add('visible');
  });
}, { threshold: 0.1 });

const compileObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const card = e.target;
    const overlay = card.querySelector('.compile-overlay');
    if (!overlay) { card.classList.add('visible'); compileObs.unobserve(card); return; }
    const progLine = document.createElement('div');
    progLine.style.cssText = 'margin-top:6px;color:#4dd9f0;font-size:9px;font-family:monospace';
    progLine.textContent = '[□□□□□□ 0%]  errors: 0  warnings: 0';
    overlay.appendChild(progLine);
    let pct = 0;
    const iv = setInterval(() => {
      pct = Math.min(pct + 4, 100);
      const filled = Math.round(pct / 100 * 6);
      progLine.textContent = `[${'■'.repeat(filled)}${'□'.repeat(6 - filled)} ${pct}%]  errors: 0  warnings: 0`;
      if (pct >= 100) { clearInterval(iv); setTimeout(() => { card.classList.add('visible'); compileObs.unobserve(card); }, 180); }
    }, 14);
  });
}, { threshold: 0.25 });

function charStagger(el, delay) {
  if (!el) return;
  const text = el.textContent;
  el.innerHTML = '';
  [...text].forEach((ch, i) => {
    const s = document.createElement('span');
    s.style.cssText = 'display:inline-block;opacity:0;transform:translateX(-10px);color:#4dd9f0;transition:opacity 0.3s ease,transform 0.4s cubic-bezier(0.22,1,0.36,1),color 0.6s ease';
    s.textContent = ch === ' ' ? ' ' : ch;
    el.appendChild(s);
    setTimeout(() => { s.style.opacity = '1'; s.style.transform = 'none'; s.style.color = ''; }, delay + i * 40);
  });
}

function setupSpringHovers() {
  if (typeof anime === 'undefined') return;
  const sp = anime.createSpring({ mass: 1, stiffness: 80, damping: 10 });
  document.querySelectorAll('.project-card').forEach(el => {
    el.addEventListener('mouseenter', () => anime({ targets: el, translateY: -6, ease: sp }));
    el.addEventListener('mouseleave', () => anime({ targets: el, translateY: 0, ease: sp }));
  });
}

function setupFeatTabs() {
  document.querySelector('.feat-tabs')?.addEventListener('click', e => {
    const tab = e.target.closest('.feat-tab');
    if (!tab) return;
    document.querySelectorAll('.feat-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const show = tab.dataset.tab;
    const infoEl = document.getElementById('featuredSwap');
    const diffEl = document.querySelector('.feat-diff-view');
    if (infoEl) infoEl.style.display = show === 'info' ? '' : 'none';
    if (diffEl) diffEl.style.display = show === 'diff' ? '' : 'none';
  });
}

function initCounters() {
  const els = document.querySelectorAll('[data-target]');
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target;
      const target = +el.dataset.target, suffix = el.dataset.suffix || '';
      let cur = 0; const step = Math.ceil(target / 40);
      const iv = setInterval(() => {
        cur = Math.min(cur + step, target);
        el.textContent = cur + suffix;
        if (cur >= target) clearInterval(iv);
      }, 30);
      obs.unobserve(el);
    });
  }, { threshold: 0.5 });
  els.forEach(el => obs.observe(el));
}

charStagger(document.querySelector('.page-header h1'), 700);

window.addEventListener('load', () => {
  if (typeof anime === 'object' && typeof anime.animate === 'function') {
    const _a = anime.animate.bind(anime), _o = anime;
    window.anime = function(o) { const t = o.targets, p = Object.assign({}, o); delete p.targets; if (p.update) { p.onUpdate = p.update; delete p.update; } if (p.complete) { p.onComplete = p.complete; delete p.complete; } return _a(t, p); };
    Object.assign(window.anime, _o);
  }
  render();
  setupSpringHovers();
  setupFeatTabs();
  initCounters();
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
  document.querySelectorAll('.compile-card').forEach(el => compileObs.observe(el));
  setTimeout(() => animateFeatPanel(CONFIG.featuredProject), 400);
});

// ── SCROLL PROGRESS + STATUS BAR ──
(function() {
  const fill = document.getElementById('scroll-fill');
  const pctEl = document.getElementById('term-pct');
  window.addEventListener('scroll', () => {
    const pct = Math.min(100, (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100);
    if (fill) fill.style.width = pct + '%';
    if (pctEl) pctEl.textContent = Math.round(pct) + '%';
  }, { passive: true });
  function updateClock() {
    const el = document.getElementById('term-clock');
    if (!el) return;
    const n = new Date();
    el.textContent = [n.getHours(), n.getMinutes(), n.getSeconds()].map(v => String(v).padStart(2,'0')).join(':');
  }
  updateClock();
  setInterval(updateClock, 1000);

  (function typewriterPath() {
    const el = document.getElementById('term-path');
    if (!el) return;
    const finalHTML = el.innerHTML, text = el.textContent;
    el.textContent = ''; let i = 0;
    (function t() {
      if (i <= text.length) { el.textContent = text.slice(0, i++); setTimeout(t, 28); }
      else el.innerHTML = finalHTML;
    })();
  })();

  (function uptimeWidget() {
    const el = document.getElementById('uptime-widget');
    if (!el) return;
    const base = { days: 2190, load: 0.04, mem: 42 };
    function update() {
      const d = base.days + Math.floor(Date.now() / 86400000) % 7;
      const load = (base.load + Math.sin(Date.now() / 8000) * 0.02).toFixed(2);
      const mem = Math.round(base.mem + Math.sin(Date.now() / 12000) * 3);
      el.textContent = `uptime: ${d}d  load: ${load}  mem: ${mem}%`;
    }
    update(); setInterval(update, 3000);
  })();
})();

<script>
(function cmdPalette() {
  const ITEMS = [
    { icon:'~', title:'Home', sub:'index', url:'index.html' },
    { icon:'◈', title:'About', sub:'about', url:'about.html' },
    { icon:'◉', title:'Articles', sub:'articles', url:'articles.html' },
    { icon:'⚡', title:'Projects', sub:'projects', url:'projects.html' },
    { icon:'◆', title:'Connect', sub:'connect', url:'connect.html' },
    { icon:'↗', title:'GitHub', sub:'github.com/dweebyuserx', url:'https://github.com/dweebyuserx' },
    { icon:'↗', title:'LinkedIn', sub:'roshan-abraham', url:'https://www.linkedin.com/in/roshan-abraham-187474138/' },
    { icon:'↗', title:'HuggingFace', sub:'huggingface.co/dweebster', url:'https://huggingface.co/dweebster' },
  ];
  let selected = 0, filtered = [...ITEMS], palOpen = false;
  const pal = document.getElementById('cmd-palette');
  const input = document.getElementById('cmd-input');
  const results = document.getElementById('cmd-results');
  if (!pal || !input || !results) return;

  function open() {
    palOpen = true;
    pal.style.display = '';
    pal.style.opacity = '0'; pal.style.transition = 'opacity 0.15s';
    requestAnimationFrame(() => { pal.style.opacity = '1'; });
    input.value = ''; filter(''); input.focus();
  }
  function close() {
    palOpen = false;
    pal.style.opacity = '0';
    setTimeout(() => { pal.style.display = 'none'; }, 150);
  }

  function filter(q) {
    const lq = q.toLowerCase();
    filtered = q ? ITEMS.filter(i => i.title.toLowerCase().includes(lq) || i.sub.toLowerCase().includes(lq)) : [...ITEMS];
    selected = 0; renderResults();
  }
  function renderResults() {
    results.innerHTML = filtered.map((item, i) => `
      <div class="cmd-item${i === selected ? ' selected' : ''}" data-idx="${i}">
        <span class="cmd-item-icon">${item.icon}</span>
        <span class="cmd-item-title">${item.title}</span>
        <span class="cmd-item-sub">${item.sub}</span>
      </div>`).join('');
    results.querySelectorAll('.cmd-item').forEach(el => {
      el.addEventListener('click', () => navigate(+el.dataset.idx));
    });
  }
  function navigate(idx) { const item = filtered[idx]; if (item) window.location.href = item.url; close(); }

  document.addEventListener('keydown', e => {
    if ((e.key === '/' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT') ||
        ((e.ctrlKey || e.metaKey) && e.key === 'k')) {
      e.preventDefault(); open(); return;
    }
    if (!palOpen) return;
    if (e.key === 'Escape') { close(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); selected = (selected + 1) % (filtered.length || 1); renderResults(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); selected = (selected - 1 + (filtered.length || 1)) % (filtered.length || 1); renderResults(); return; }
    if (e.key === 'Enter') { if (input.value.trim() !== 'sudo') navigate(selected); return; }
  });
  input.addEventListener('input', e => filter(e.target.value));
  document.getElementById('cmd-overlay').addEventListener('click', close);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && input.value.trim() === 'sudo') { triggerGlitchEgg(); close(); }
  });
})();

function triggerGlitchEgg() {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;pointer-events:none;font-family:"Share Tech Mono",monospace;font-size:12px;color:#3dffa0;overflow:hidden;background:rgba(0,0,0,0.92);padding:40px';
  const lines = ['ACCESS GRANTED','sudo: Roshan is not in the sudoers file.','This incident will be reported.','...just kidding.','rm -rf /restrictions','[ ██████████ ] 100%','welcome, root.'];
  let i = 0;
  const iv = setInterval(() => {
    overlay.innerHTML += `<div style="padding:2px 0">&gt; ${lines[i] || ''}</div>`;
    if (++i >= lines.length) { clearInterval(iv); setTimeout(() => overlay.remove(), 2000); }
  }, 350);
  document.body.appendChild(overlay);
}

(function konamiEgg() {
  const seq = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let idx = 0;
  document.addEventListener('keydown', e => {
    if (e.key === seq[idx]) { idx++; if (idx === seq.length) { triggerGlitchEgg(); idx = 0; } }
    else idx = 0;
  });
})();
</script>
